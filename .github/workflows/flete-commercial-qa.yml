name: Verify Flete commercial v3
on:
  push:
    branches: [feat/flete-commercial-v3]
permissions:
  contents: write
concurrency:
  group: flete-commercial-v3
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'bitflowapp/luna-proyectos-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: python3 .release/flete-v3/apply.py
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build && npm run test:unit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: flete-v3-browser-evidence
          path: |
            test-results
            artifacts/playwright-results.json
          retention-days: 7
      - name: Commit only verified demo artifacts to this branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/flete-commercial-v3'
          git config user.name 'LUNA Demo Build'
          git config user.email 'noreply@luna.local'
          git add public/demos/flete tests/flete-preview.spec.ts
          git rm -r .release/flete-v3 .github/workflows/flete-commercial-qa.yml
          git commit -m 'feat(flete): publish verified commercial v0.3.0 assets'
          git push origin HEAD:feat/flete-commercial-v3
