name: Flete public health check
on:
  push:
    branches: ['verify/flete-public-health']
    paths: ['.github/workflows/flete-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public Pages delivery
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, gzip, hashlib, json, time, urllib.request
          base = 'https://bitflowapp.github.io/luna-proyectos-web/demos/flete/'
          expected = 'b954c193fce98adc3dce7da6dfd579ad619f09bbf0da82b5df37660e60baab73'
          def read(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Flete-Demo-Delivery-QA/0.2', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  assert response.status == 200, str(response.status)
                  return response.read()
          last_error = None
          for attempt in range(12):
              try:
                  html = read(base).decode('utf-8')
                  assert 'Flete' in html and expected in html
                  assert 'Rol de demostración' in html
                  with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                      parts = list(pool.map(read, [base + 'bundle-b954c193fce9-' + str(i).zfill(2) + '.bin' for i in range(1, 11)]))
                  assert [len(p) for p in parts] == [6144] * 9 + [463]
                  payload = b''.join(parts)
                  assert hashlib.sha256(payload).hexdigest() == expected
                  data = json.loads(gzip.decompress(payload))
                  assert isinstance(data['javascript'], str) and isinstance(data['css'], str)
                  assert 'Solicitar un servicio' in data['javascript']
                  print('PUBLIC_DELIVERY_RESULT=' + json.dumps({'status': 'PASS', 'public_url': base, 'admin_url': base + '#/admin', 'http_status': 200, 'bundle_parts': len(parts), 'bytes': len(payload), 'sha256': expected, 'decompression': 'PASS', 'checked_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}))
                  break
              except Exception as error:
                  last_error = error
                  print('Attempt', attempt + 1, type(error).__name__, str(error))
                  time.sleep(5)
          else:
              raise RuntimeError('Public delivery verification failed: ' + str(last_error))
          PY
