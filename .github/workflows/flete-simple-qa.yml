name: Verify Flete simple journey
on:
  push:
    branches: [fix/flete-simple-journey]
    paths: [.github/workflows/flete-simple-qa.yml]
permissions:
  contents: write
concurrency:
  group: flete-simple-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/flete-simple-journey
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Apply exact reviewed Flete source changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path('.')
          parts = sorted(root.glob('.review/flete-simple/*.b64'))
          assert len(parts) == 4
          raw = zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'bf8c33db2fcef67b41774b85edb4ca5d96da64bc9a0dd17ad0e998b09439691a'
          rows = json.loads(raw)
          allowed = {'docs/FLETE_SIMPLE_0.5.md', 'scripts/flete-src/app.js', 'scripts/flete-src/commercial.js', 'scripts/flete-src/domain.js', 'scripts/flete-src/preview-store.js', 'scripts/flete-src/simple-request.js', 'scripts/flete-src/styles.css', 'scripts/flete-src/tracking.js', 'scripts/pack-flete.mjs', 'tests/contracts.test.mjs', 'tests/flete-finish.spec.ts', 'tests/flete-preview.spec.ts', 'tests/flete-simple.spec.ts'}
          assert len(rows) == len(allowed) and {r['path'] for r in rows} == allowed
          verified = []
          for row in rows:
              path = root / row['path']
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == row['old_sha256'], row['path'] + ': baseline changed'
              lines = old.decode('utf-8').splitlines(keepends=True)
              for edit in sorted(row['edits'], key=lambda e: e['start'], reverse=True):
                  assert 0 <= edit['start'] <= edit['end'] <= len(lines)
                  lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
              data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == row['new_sha256'], row['path'] + ': output differs'
              verified.append((path, data))
          for path, data in verified:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Reviewed source applied:', len(verified), 'files')
          PY
      - name: Build Flete and validate source syntax
        run: node scripts/pack-flete.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium webkit
      - name: Native Chromium and WebKit regression
        run: npm test
      - name: Record exact browser test counts
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('artifacts/playwright-results.json')
          if not p.exists():
              print('No browser result was produced'); raise SystemExit(0)
          data = json.loads(p.read_text())
          cases=[]
          def visit(node):
              for spec in node.get('specs', []):
                  for test in spec.get('tests', []):
                      cases.append({'title':spec['title'], 'project':test['projectName'], 'status':test['status']})
              for child in node.get('suites', []): visit(child)
          visit(data)
          summary={'stats':data.get('stats'), 'total':len(cases), 'flete':sum(x['title'].startswith('Flete') for x in cases), 'by_project':{p:sum(x['project']==p for x in cases) for p in sorted({x['project'] for x in cases})}, 'failed':[x for x in cases if x['status']!='expected']}
          out=pathlib.Path('/tmp/flete-simple-qa');out.mkdir(exist_ok=True)
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: flete-simple-journey-qa
          path: |
            /tmp/flete-simple-qa/
            artifacts/playwright-results.json
            test-results/
          retention-days: 5
      - name: Commit only verified Flete files
        run: |
          git restore artifacts/playwright-results.json
          git rm -r .review/flete-simple
          git rm .github/workflows/flete-simple-snapshot.yml .github/workflows/flete-simple-qa.yml
          git add scripts/flete-src scripts/pack-flete.mjs public/demos/flete tests/contracts.test.mjs tests/flete-finish.spec.ts tests/flete-preview.spec.ts tests/flete-simple.spec.ts docs/FLETE_SIMPLE_0.5.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(flete): three-step requests, clear demo handoff and resilient tracking v0.5.0'
          git push origin HEAD:fix/flete-simple-journey
